# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  companion:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: companion/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:ui
      - run: npm test
      - run: npm run build
      - name: Committed bundle is current
        if: runner.os == 'Linux'
        run: git diff --exit-code -- dist

  zed:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zed
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --target wasm32-wasip2 -- -D warnings
      - run: cargo test
      - run: cargo build --release --target wasm32-wasip2

  vscode:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      # the committed companion bundle is packaged as is
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:grammar -- test/fixtures/sample.overlay
      - run: npm run package
      - name: Third-party notices are current
        if: runner.os == 'Linux'
        run: node ../scripts/notices.mjs --check
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: zephyr-devicetree-vsix
          path: vscode/dist/zephyr-devicetree.vsix
